name: Release agent binaries and VS Code extension

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: ledger-agent-linux
          - os: macos-latest
            asset_name: ledger-agent-macos
          - os: windows-latest
            asset_name: ledger-agent-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build binary
        working-directory: agent
        run: python -m PyInstaller --onefile --name ledger-agent ledger_agent.py

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: mv agent/dist/ledger-agent agent/dist/${{ matrix.asset_name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: mv agent/dist/ledger-agent.exe agent/dist/${{ matrix.asset_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: agent/dist/${{ matrix.asset_name }}

  build-vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm install --include=dev

      - name: Compile
        working-directory: vscode-extension
        run: npm run compile

      - name: Package .vsix
        working-directory: vscode-extension
        run: npx --yes @vscode/vsce package --out ledger-token-sync.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: ledger-token-sync.vsix
          path: vscode-extension/ledger-token-sync.vsix

  release:
    needs: [build, build-vscode-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
