name: Release agent binaries

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: ledger-agent-linux
          - os: macos-latest
            asset_name: ledger-agent-macos
          - os: windows-latest
            asset_name: ledger-agent-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build binary
        run: python -m PyInstaller --onefile --name ledger-agent ledger_agent.py

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: mv dist/ledger-agent dist/${{ matrix.asset_name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: mv dist/ledger-agent.exe dist/${{ matrix.asset_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
