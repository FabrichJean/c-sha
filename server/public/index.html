<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;650;700&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <nav class="sidebar">
    <div class="brand"><span class="mark"></span><span class="name">Ledger</span></div>
    <div style="padding:0 10px 14px"><span class="brand sub" style="padding:0">Conso Claude Code</span></div>
    <button class="navitem active" data-view="dashboard"><span class="ic" style="color:var(--accent)">◧</span>Tableau de bord</button>
    <button class="navitem" data-view="clients"><span class="ic" style="color:var(--violet)">◔</span>Clients</button>
    <!-- <button class="navitem" data-view="projects"><span class="ic" style="color:#c9622a">◇</span>Projets</button> -->
    <button class="navitem" data-view="promotions"><span class="ic" style="color:#c9427a">%</span>Promotions</button>
    <button class="navitem" data-view="devices"><span class="ic" style="color:#3f8f6e">▧</span>Appareils</button>
    <button class="navitem" data-view="invoices"><span class="ic" style="color:#8a5cc9">▥</span>Factures</button>
    <button class="navitem" data-view="import"><span class="ic" style="color:#4a7fb5">▤</span>Docs</button>
    <!-- <button class="navitem" data-view="settings"><span class="ic" style="color:var(--bad)">⚙</span>Tarifs</button> -->
    <div class="sidebar-extra">
      <div class="sys-card" id="sidebar-status">
        <span class="sys-dot"></span>
        <div><div class="sys-title">Connexion…</div></div>
      </div>
      <div class="user-chip">
        <span class="avatar">AD</span>
        <div><div class="u-name">Admin</div><div class="u-role">Compte administrateur</div></div>
        <span class="chev">⌄</span>
      </div>
    </div>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
